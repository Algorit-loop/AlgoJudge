[project]
name = "algojudge-site"
version = "0.1.0"
description = "AlgoJudge site: FastAPI API (later also Celery worker, bridge, wsevent)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "redis",
    "alembic",
    "argon2-cffi",
    "email-validator",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The api container runs as an app user that cannot write into ./site, so do not keep a .pytest_cache there.
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
