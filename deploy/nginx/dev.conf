# Development: one entry point for the browser.
#   /api/*  -> FastAPI (api:8000, from site/)
#   /*      -> Vite dev server (ui:5173, from ui/), including its hot-reload WebSocket
# Later: /ws -> wsevent.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api {
    server api:8000;
}

upstream ui {
    server ui:5173;
}

server {
    listen 80;
    server_name _;

    # Max upload size (test data zips will need more; raised in M3).
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
