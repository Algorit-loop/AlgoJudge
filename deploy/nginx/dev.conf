# Development: one entry point for the browser.
#   /api/*  -> FastAPI (api:8000, from site/)
#   /*      -> Vite dev server (ui:5173, from ui/), including its hot-reload WebSocket
#   /media/ -> uploaded files in ./data/media (read-only)
# Later: /ws -> wsevent.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api {
    server api:8000;
}

upstream ui {
    server ui:5173;
}

server {
    listen 80;
    server_name _;

    # Max upload size (test data zips will need more; raised in M3).
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded statement images, written by the API. Served as plain files with no script execution:
    # nosniff stops browsers guessing a type, and the CSP blocks anything active inside them.
    location /media/ {
        alias /data/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
        expires 30d;
    }

    location / {
        proxy_pass http://ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
